<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Helmet Metallic Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e62"/>
      <stop offset="100%" stop-color="#ff9966"/>
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Icon Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Speed Lines Background -->
  <path d="M-20 120 L180 -20" stroke="#ffffff" stroke-opacity="0.08" stroke-width="24" stroke-linecap="round"/>
  <path d="M-20 260 L380 -20" stroke="#ffffff" stroke-opacity="0.05" stroke-width="36" stroke-linecap="round"/>
  <path d="M120 532 L532 120" stroke="#ffffff" stroke-opacity="0.08" stroke-width="28" stroke-linecap="round"/>

  <!-- Race Checkered Flag Detail (Bottom Left & Right) -->
  <g opacity="0.15" fill="#ffffff">
    <rect x="40" y="380" width="30" height="30"/>
    <rect x="70" y="410" width="30" height="30"/>
    <rect x="100" y="380" width="30" height="30"/>
    <rect x="40" y="440" width="30" height="30"/>
    <rect x="440" y="100" width="30" height="30"/>
    <rect x="410" y="130" width="30" height="30"/>
    <rect x="380" y="100" width="30" height="30"/>
  </g>

  <!-- Main Michi Group -->
  <g filter="url(#shadow)">
    <!-- Cat Ears (Outer Helmet Mold) -->
    <path d="M145 190 L110 85 L210 135 Z" fill="url(#helmetGrad)"/>
    <path d="M367 190 L402 85 L302 135 Z" fill="url(#helmetGrad)"/>

    <!-- Inner Ear Details -->
    <path d="M142 170 L125 105 L185 142 Z" fill="#2d0654"/>
    <path d="M370 170 L387 105 L327 142 Z" fill="#2d0654"/>

    <!-- Helmet Main Dome -->
    <circle cx="256" cy="270" r="145" fill="url(#helmetGrad)"/>

    <!-- Racing Stripe Center -->
    <path d="M236 126 C 246 125, 266 125, 276 126 L 276 415 C 266 416, 246 416, 236 415 Z" fill="url(#goldGrad)"/>

    <!-- Visor Frame Cutout -->
    <path d="M150 220 Q256 190 362 220 Q380 300 362 315 Q256 345 150 315 Q132 300 150 220 Z" fill="#1e1b4b"/>

    <!-- Visor Glass -->
    <path d="M158 228 Q256 200 354 228 Q370 292 354 305 Q256 333 158 305 Q142 292 158 228 Z" fill="url(#visorGrad)"/>

    <!-- Visor Reflection Flare -->
    <path d="M175 240 Q240 218 310 235 Q280 250 185 260 Z" fill="#ffffff" opacity="0.55"/>

    <!-- Michi Paw on Helmet / Steering Wheel Hint -->
    <circle cx="256" cy="380" r="28" fill="#ffffff"/>
    <ellipse cx="240" cy="365" rx="7" ry="9" fill="#ffffff"/>
    <ellipse cx="256" cy="360" rx="7" ry="9" fill="#ffffff"/>
    <ellipse cx="272" cy="365" rx="7" ry="9" fill="#ffffff"/>
    
    <!-- Paw Pad Print -->
    <path d="M248 382 C248 375 264 375 264 382 C264 390 248 390 248 382 Z" fill="#ff5e62"/>
  </g>
</svg>
